<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DGM-MAT Browser Operator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <strong>DGM-MAT</strong>
      <span>Operador de sessões do navegador</span>
    </header>
    <section id="pair-section">
      <label for="pair-code">Código de ligação de utilização única</label>
      <input id="pair-code" type="password" autocomplete="off" spellcheck="false" placeholder="Código gerado no PC DGM-MAT">
      <button id="pair-button" type="button">Ligar ao DGM-MAT</button>
    </section>
    <section>
      <label class="toggle"><input id="browser-operator-checkbox" type="checkbox"> Executar automaticamente tarefas de missões já aprovadas no DGM-MAT</label>
      <small>Usa apenas separadores autenticados já abertos. As tarefas exigem aprovação no DGM-MAT e nunca são repetidas automaticamente após uma falha.</small>
    </section>
    <section>
      <label class="toggle"><input id="auto-checkbox" type="checkbox"> Ativar recuperação automática nos separadores abertos</label>
      <button id="start-button" type="button" disabled>Analisar e recuperar este fornecedor</button>
      <button id="retry-button" type="button" class="secondary" disabled>Repetir conversa bloqueada</button>
      <button id="stop-button" type="button" class="secondary">Parar recuperação</button>
    </section>
    <p id="status" role="status">Checking local connection…</p>
    <small>Só é lido conteúdo visível. Não são acedidos cookies, palavras-passe ou APIs ocultas.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
