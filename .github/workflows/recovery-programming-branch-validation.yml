name: Recovery and Programming Branch Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-programming-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    name: Focused regressions (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only required test dependencies
        run: python -m pip install pytest fastapi
      - name: Compile changed Python areas
        run: python -m compileall -q core tests tools
      - name: Run recovery and programming regression suites
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/test_recovery_ledger.py
          tests/test_chatgpt_export_importer.py
          tests/api/test_recovery_api.py
          tests/test_audit_development_callers.py
          tests/test_development_change_scope_review.py
          tests/test_development_evidence_envelope.py
          tests/test_development_language_catalog.py
          tests/test_development_safety_gates.py
          tests/test_development_task_result.py
          tests/test_development_task_store.py
          tests/test_development_toolchain_probe.py
