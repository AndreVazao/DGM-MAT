name: Windows Back-office and Dashboard Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout DGM-MAT
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download public dashboard source
        shell: pwsh
        run: |
          git -c protocol.version=2 clone --depth 1 --branch main https://github.com/AndreVazao/DGM-Cockpit-Frontend.git dashboard-source
          if (!(Test-Path "dashboard-source/app.js") -or !(Test-Path "dashboard-source/tests/cockpit-contract.test.cjs")) { throw "Dashboard checkout is incomplete or missing expected files." }
          $dashboardSha = (git -C dashboard-source rev-parse HEAD).Trim()
          "DGM_DASHBOARD_SHA=$dashboardSha" >> $env:GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate dashboard source
        working-directory: dashboard-source
        shell: pwsh
        run: |
          node --check app.js
          node --test tests/cockpit-contract.test.cjs

      - name: Run governed executor and API security tests
        shell: pwsh
        env:
          PYTHONPATH: .
          DGM_COMMAND_AUDIT_PATH: dgm-command-audit.jsonl
        run: |
          python -m pytest -q tests/test_command_executor.py tests/test_operation_audit.py tests/security/test_api_global_auth_enforcement.py tests/security/test_api_security_policy.py

      - name: Build headless Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name DGM-MAT-BackOffice --collect-submodules core --collect-submodules shared --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan.on main.py
          if (!(Test-Path "dist/DGM-MAT-BackOffice/DGM-MAT-BackOffice.exe")) { throw "PyInstaller did not produce the expected executable." }

      - name: Assemble installable package
        shell: pwsh
        run: |
          $release = Join-Path $PWD "release/DGM-MAT-Windows"
          New-Item -ItemType Directory -Force -Path "$release/engine", "$release/dashboard" | Out-Null
          Copy-Item "dist/DGM-MAT-BackOffice/*" "$release/engine" -Recurse -Force
          Copy-Item "dashboard-source/index.html", "dashboard-source/app.js", "dashboard-source/styles.css" "$release/dashboard" -Force
          Copy-Item "packaging/windows/Install-DGM-MAT.ps1" "$release/Install-DGM-MAT.ps1" -Force
          Copy-Item "packaging/windows/README-PT-PT.md" "$release/README-PT-PT.md" -Force
          Set-Content -Path "$release/BUILD.txt" -Value @("DGM-MAT commit: $env:GITHUB_SHA", "Dashboard source: AndreVazao/DGM-Cockpit-Frontend@$env:DGM_DASHBOARD_SHA", "Workflow run: $env:GITHUB_RUN_ID") -Encoding utf8
          Compress-Archive -Path "$release/*" -DestinationPath "$PWD/DGM-MAT-Windows-BackOffice-Dashboard.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: DGM-MAT-Windows-BackOffice-Dashboard
          path: DGM-MAT-Windows-BackOffice-Dashboard.zip
          if-no-files-found: error
          retention-days: 30
