name: Branch Recovery Intelligence

on:
  pull_request:
    paths:
      - "core/repository_intelligence/branch_recovery_analyzer.py"
      - "tests/repository_intelligence/test_branch_recovery_analyzer.py"
      - "scripts/run_branch_recovery_audit.py"
      - ".github/workflows/branch-recovery-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "core/repository_intelligence/branch_recovery_analyzer.py"
      - "tests/repository_intelligence/test_branch_recovery_analyzer.py"
      - "scripts/run_branch_recovery_audit.py"
      - ".github/workflows/branch-recovery-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-recovery-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-policy:
    name: Branch recovery policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DGM_TEST_MODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile branch recovery tools
        run: python -m compileall -q core/repository_intelligence/branch_recovery_analyzer.py scripts/run_branch_recovery_audit.py
      - name: Run branch recovery contract tests
        run: python -m pytest -q tests/repository_intelligence/test_branch_recovery_analyzer.py
