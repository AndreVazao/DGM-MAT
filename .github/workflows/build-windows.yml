---
name: Windows Executable Build

"on":
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Checkout DGM-Contracts
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-Contracts
          ref: 4d65419e17195d046607cbf68539e7cd556e1da2
          path: DGM-Contracts
          persist-credentials: false

      - name: Checkout DGM-MAT-Agents
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-MAT-Agents
          ref: 50f98db5cf845b03280df7d978ae1129abe14419
          path: DGM-MAT-Agents
          persist-credentials: false

      - name: Checkout DGM-MAT-Connectors
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-MAT-Connectors
          ref: d339de22258e16d808b97360b47339c9b208f457
          path: DGM-MAT-Connectors
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e DGM-Contracts
          python -m pip install -e DGM-MAT-Agents
          python -m pip install -e DGM-MAT-Connectors
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Browser Extension Installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install_browser_extension.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Browser extension installer has PowerShell syntax errors."
          }
          if (-not (Test-Path "browser_extension/manifest.json")) {
            throw "Browser extension manifest is missing."
          }

      - name: Resolve build version
        shell: pwsh
        run: |
          $version = git rev-parse --short HEAD
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Clean Build Environment
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item -Recurse -Force "dist"
          }
          if (Test-Path "build-temp") {
            Remove-Item -Recurse -Force "build-temp"
          }
          Get-ChildItem -Path . -Filter "*.toc" -Recurse |
            Remove-Item -Force
          Get-ChildItem -Path . -Filter "*.pkg" -Recurse |
            Remove-Item -Force
          Get-ChildItem -Path . -Filter "*.pyz" -Recurse |
            Remove-Item -Force

      - name: Build Executable
        run: |
          pyinstaller --workpath build-temp --distpath dist build/dgm_mat.spec

      - name: Validate Executable (Deep Check)
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate_executable.py dist/DGM-MAT.exe

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          if (Test-Path "publish") {
            Remove-Item -Recurse -Force "publish"
          }
          mkdir publish
          mkdir publish\scripts
          mkdir publish\scripts\autostart
          mkdir publish\config
          mkdir publish\browser_extension
          copy dist\DGM-MAT.exe publish\
          Copy-Item -Path "browser_extension\*" -Destination "publish\browser_extension" -Recurse -Force
          copy health.json publish\
          copy ecosystem.json publish\
          copy README.md publish\
          copy architecture.md publish\
          copy config\*.json publish\config\
          copy scripts\autostart\*.py publish\scripts\autostart\
          copy scripts\runtime_smoke_test.py publish\scripts\
          copy scripts\install_windows_update.ps1 publish\scripts\
          copy scripts\rollback_windows_update.ps1 publish\scripts\
          copy scripts\install_browser_extension.ps1 publish\scripts\
          copy scripts\install_browser_extension.bat publish\scripts\
          copy docs\operations\DGM-MAT-BROWSER-PROVIDERS.md publish\
          copy docs\operations\INSTALL_DGM_MAT_BROWSER_EXTENSION.md publish\
          $zip = "DGM-MAT-Windows-${{ matrix.python-version }}-$env:VERSION.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          certutil -hashfile $zip SHA256 | Select-Object -Skip 1 | ForEach-Object { $_.Trim() } | Out-File "$zip.sha256" -Encoding utf8

      - name: Final Build Assertions
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DGM-MAT.exe")) {
            throw "Executable missing"
          }

          $zip = "DGM-MAT-Windows-${{ matrix.python-version }}-$env:VERSION.zip"
          $checksum = "$zip.sha256"
          if (-not (Test-Path $zip)) {
            throw "Distribution ZIP missing: $zip"
          }
          if (-not (Test-Path $checksum)) {
            throw "SHA-256 file missing: $checksum"
          }
          if (-not (Test-Path "publish\browser_extension\manifest.json")) {
            throw "Browser extension was not packaged."
          }
          if (-not (Test-Path "publish\scripts\install_browser_extension.bat")) {
            throw "One-click browser extension installer was not packaged."
          }
          if ((Get-Item $zip).Length -le 0) {
            throw "Distribution ZIP is empty"
          }
          if (-not (Select-String -Path $checksum -Pattern '^[0-9A-Fa-f]{64}$' -Quiet)) {
            throw "SHA-256 file does not contain a valid digest"
          }
          Write-Host "Executable, ZIP and SHA-256 verified."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: "DGM-MAT-Windows-${{ matrix.python-version }}-${{ env.VERSION }}"
          path: |
            DGM-MAT-Windows-${{ matrix.python-version }}-${{ env.VERSION }}.zip
            DGM-MAT-Windows-${{ matrix.python-version }}-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error
