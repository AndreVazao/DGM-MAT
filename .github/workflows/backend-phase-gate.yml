name: Backend Phase Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "shared/**"
      - "cockpit/**"
      - "tests/**"
      - "requirements*.txt"
      - "requirements/**"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/backend-phase-gate.yml"

permissions:
  contents: read

concurrency:
  group: backend-phase-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mission-api-and-runtime:
    name: Mission API, queue and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore modular runtime dependencies
        env:
          DGM_CONTRACTS_READ_TOKEN: ${{ secrets.DGM_CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "$DGM_CONTRACTS_READ_TOKEN" ]; then
            echo "::error::Missing DGM_CONTRACTS_READ_TOKEN. Add a fine-grained token with read-only Contents access to the private AndreVazao/DGM-Contracts repository."
            exit 1
          fi
          GH_TOKEN="$DGM_CONTRACTS_READ_TOKEN" gh repo clone AndreVazao/DGM-Contracts ../DGM-Contracts
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Connectors.git ../DGM-MAT-Connectors
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Agents.git ../DGM-MAT-Agents
          python -m pip install -e ../DGM-Contracts
          python -m pip install -e ../DGM-MAT-Connectors
          python -m pip install -e ../DGM-MAT-Agents
      - name: Compile Python modules
        run: python -m compileall -q core cockpit shared
      - name: Validate mission API truth and queue contracts
        env:
          PYTHONPATH: .
          DGM_COMMAND_AUDIT_PATH: ${{ runner.temp }}/dgm-command-audit.jsonl
        run: >-
          pytest -q
          tests/operational/test_cockpit_mission_trace.py
          tests/runtime/test_safe_action_queue.py
          tests/contracts/test_queue_boundary.py
          tests/autonomy/test_mission_system.py
          tests/autonomy/test_mission_recovery.py
          tests/contracts/test_cross_process_mission.py

  understand-help-research-learn:
    name: Understanding, help-seeking, research and learning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate intent planning and help-seeking behavior
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/autonomy/test_local_mission_planner.py
          tests/autonomy/test_mission_intent_router.py
          tests/autonomy/test_mission_research.py
          tests/autonomy/test_mission_capability_discovery.py
          tests/autonomy/test_mission_help_seeking.py
          tests/autonomy/test_mission_human_intervention.py
          tests/organization/test_capability_scout.py
          tests/organization/test_help_seeking.py
      - name: Validate persistent knowledge store and self-evolution proposals
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/conversation_intelligence/test_knowledge_store.py tests/self_evolution/test_self_analysis.py
          if [ -f tests/self_evolution/test_evolution_sandbox_truth.py ]; then
            pytest -q tests/self_evolution/test_evolution_sandbox_truth.py
          else
            echo "::notice::Evolution truth regression tests are introduced on the backend stabilization branch and will run when present."
          fi
          if [ -f tests/learning/test_learning_engine.py ]; then
            pytest -q tests/learning/test_learning_engine.py
          else
            echo "::notice::Execution-learning persistence tests will run when the learning engine test file is present."
          fi

  security-and-governed-execution:
    name: Authentication, permissions and governed execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore modular runtime dependencies
        env:
          DGM_CONTRACTS_READ_TOKEN: ${{ secrets.DGM_CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "$DGM_CONTRACTS_READ_TOKEN" ]; then
            echo "::error::Missing DGM_CONTRACTS_READ_TOKEN. Add a fine-grained token with read-only Contents access to the private AndreVazao/DGM-Contracts repository."
            exit 1
          fi
          GH_TOKEN="$DGM_CONTRACTS_READ_TOKEN" gh repo clone AndreVazao/DGM-Contracts ../DGM-Contracts
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Connectors.git ../DGM-MAT-Connectors
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Agents.git ../DGM-MAT-Agents
          python -m pip install -e ../DGM-Contracts
          python -m pip install -e ../DGM-MAT-Connectors
          python -m pip install -e ../DGM-MAT-Agents
      - name: Validate auth and security policy
        env:
          PYTHONPATH: .
          DGM_COMMAND_AUDIT_PATH: ${{ runner.temp }}/dgm-command-audit.jsonl
        run: >-
          pytest -q
          tests/security/test_api_global_auth_enforcement.py
          tests/security/test_api_security_policy.py
          tests/test_command_executor.py
          tests/test_operation_audit.py

  research-and-knowledge-fabric:
    name: Research, knowledge fabric and consolidation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore modular runtime dependencies
        env:
          DGM_CONTRACTS_READ_TOKEN: ${{ secrets.DGM_CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "$DGM_CONTRACTS_READ_TOKEN" ]; then
            echo "::error::Missing DGM_CONTRACTS_READ_TOKEN. Add a fine-grained token with read-only Contents access to the private AndreVazao/DGM-Contracts repository."
            exit 1
          fi
          GH_TOKEN="$DGM_CONTRACTS_READ_TOKEN" gh repo clone AndreVazao/DGM-Contracts ../DGM-Contracts
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Connectors.git ../DGM-MAT-Connectors
          git clone --depth 1 https://github.com/AndreVazao/DGM-MAT-Agents.git ../DGM-MAT-Agents
          python -m pip install -e ../DGM-Contracts
          python -m pip install -e ../DGM-MAT-Connectors
          python -m pip install -e ../DGM-MAT-Agents
      - name: Validate research, knowledge fabric and consolidation
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/integration/test_knowledge_fabric.py
          tests/integration/test_research_layer.py
          tests/knowledge_graph/test_consolidation.py

  minimal-chat-cockpit:
    name: Minimal PC chat cockpit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Qt runtime libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxcb-cursor0
      - name: Compile and test the minimal chat shell
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q cockpit/minimal_chat_window.py cockpit/widgets/command_console.py cockpit/app/main.py
          pytest -q tests/cockpit/test_minimal_chat_window.py

  python-source-compile:
    name: Python source syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile source and test files
        run: python -m compileall -q core cockpit shared tests

  result-summary:
    name: Required phase-gate summary
    if: always()
    needs:
      - mission-api-and-runtime
      - understand-help-research-learn
      - security-and-governed-execution
      - research-and-knowledge-fabric
      - minimal-chat-cockpit
      - python-source-compile
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate passed
        env:
          MISSION_RESULT: ${{ needs.mission-api-and-runtime.result }}
          LEARNING_RESULT: ${{ needs.understand-help-research-learn.result }}
          SECURITY_RESULT: ${{ needs.security-and-governed-execution.result }}
          RESEARCH_RESULT: ${{ needs.research-and-knowledge-fabric.result }}
          COCKPIT_RESULT: ${{ needs.minimal-chat-cockpit.result }}
          COMPILE_RESULT: ${{ needs.python-source-compile.result }}
        run: |
          printf 'Mission API/runtime: %s\n' "$MISSION_RESULT"
          printf 'Understand/help/research/learn: %s\n' "$LEARNING_RESULT"
          printf 'Security/governed execution: %s\n' "$SECURITY_RESULT"
          printf 'Research/knowledge fabric: %s\n' "$RESEARCH_RESULT"
          printf 'Minimal PC chat cockpit: %s\n' "$COCKPIT_RESULT"
          printf 'Python source syntax: %s\n' "$COMPILE_RESULT"
          test "$MISSION_RESULT" = success
          test "$LEARNING_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$RESEARCH_RESULT" = success
          test "$COCKPIT_RESULT" = success
          test "$COMPILE_RESULT" = success
