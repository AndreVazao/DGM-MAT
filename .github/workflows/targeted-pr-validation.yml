name: Focused PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/egm-review-packet-contract-2026-11-08]
    paths:
      - "core/**"
      - "scripts/sync_dgm_vault.py"
      - "shared/**"
      - "cockpit/**"
      - "tests/**"
      - "requirements*.txt"
      - "requirements/**"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/targeted-pr-validation.yml"

permissions:
  contents: read

concurrency:
  group: focused-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Compile and run only affected regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed revision and base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout DGM-MAT Connectors
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-MAT-Connectors
          ref: main
          path: DGM-MAT-Connectors
          persist-credentials: false
      - name: Checkout DGM-Contracts
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-Contracts
          ref: main
          path: DGM-Contracts
          persist-credentials: false
      - name: Checkout DGM-MAT Agents
        uses: actions/checkout@v6
        with:
          repository: AndreVazao/DGM-MAT-Agents
          ref: 50f98db5cf845b03280df7d978ae1129abe14419
          path: DGM-MAT-Agents
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q core cockpit shared tests
      - name: Select affected regression tests
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "${RUNNER_TEMP}/changed-files.txt"
          else
            git diff --name-only HEAD~1 HEAD > "${RUNNER_TEMP}/changed-files.txt" || true
          fi
          cat "${RUNNER_TEMP}/changed-files.txt"
          python - <<'PY'
          import os, pathlib
          changed_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "changed-files.txt"
          changed = set(changed_file.read_text(encoding="utf-8").splitlines())
          tests = set()
          def any_changed(*paths):
              return any(path in changed for path in paths)
          if any_changed("core/vault/catalog.py", "core/vault/__init__.py", "scripts/sync_dgm_vault.py", "tests/vault/test_catalog.py"):
              tests.add("tests/vault/test_catalog.py")
          if any_changed(
              "core/conversation_intelligence/project_context.py",
              "core/conversation_intelligence/progress_store.py",
              "tests/conversation_intelligence/test_project_context.py",
          ):
              tests.add("tests/conversation_intelligence/test_project_context.py")
          if any_changed("core/runtime/safe_action_queue.py", "tests/runtime/test_safe_action_queue.py"):
              tests.add("tests/runtime/test_safe_action_queue.py")
          if any_changed("core/autonomy/mission_engine.py", "core/execution/approval_manager.py",
                         "tests/autonomy/test_mission_approval_checkpoint_guard.py"):
              tests.update({
                  "tests/autonomy/test_mission_approval_checkpoint_guard.py",
                  "tests/autonomy/test_mission_system.py",
                  "tests/autonomy/test_mission_recovery.py",
              })
          if any_changed("core/self_healing/self_repair_engine.py"):
              tests.add("tests/self_healing/test_self_repair_engine.py")
          if any_changed("core/self_healing/self_repair_engine.py", "core/self_healing/approval_gate.py"):
              tests.add("tests/self_healing/test_self_repair_approval_gate.py")
          if any(
              path.startswith("core/security/") or path in {
                  "core/api/security.py", "core/api/runtime_api.py",
              }
              for path in changed
          ):
              tests.update({
                  "tests/security/test_api_global_auth_enforcement.py",
                  "tests/security/test_api_security_policy.py",
              })
          tests.update(path for path in changed if path.startswith("tests/") and path.endswith(".py"))
          existing = sorted(path for path in tests if pathlib.Path(path).is_file())
          gui_markers = ("PySide6", "PyQt", "QApplication", "qtbot", "pytestqt")
          has_gui_tests = any(
              any(marker in pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
                  for marker in gui_markers)
              for path in existing
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_tests=" + ("true" if existing else "false") + "\n")
              output.write("has_gui_tests=" + ("true" if has_gui_tests else "false") + "\n")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "selected-tests.txt").write_text(
              "\n".join(existing) + ("\n" if existing else ""), encoding="utf-8"
          )
          print("Selected regressions: " + (", ".join(existing) if existing else "none; no historical suites will be rerun"))
          PY
      - name: Install dependencies for selected tests only
        if: steps.select.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e DGM-Contracts
          python -m pip install -e DGM-MAT-Agents
          python -m pip install -r requirements.txt pytest
      - name: Install headless Qt system libraries when GUI regressions are selected
        if: steps.select.outputs.has_gui_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Run selected regressions only
        if: steps.select.outputs.has_tests == 'true'
        env:
          PYTHONPATH: .
          DGM_CONNECTORS_PATH: ${{ github.workspace }}/DGM-MAT-Connectors/src
          DGM_AGENTS_PATH: ${{ github.workspace }}/DGM-MAT-Agents/src
          DGM_COMMAND_AUDIT_PATH: ${{ runner.temp }}/dgm-command-audit.jsonl
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          paths = pathlib.Path(os.environ["RUNNER_TEMP"], "selected-tests.txt").read_text(encoding="utf-8").splitlines()
          sys.exit(subprocess.call([sys.executable, "-m", "pytest", "-q", *paths]))
          PY


  installer-windows:
    name: Windows installer digest gate
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v6
      - name: Validate installer syntax and fail-closed digest behavior
        shell: pwsh
        run: ./tests/windows/test_installer_digest_gate.ps1
