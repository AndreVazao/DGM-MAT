<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">DGM-MAT Digital Headquarters — wireframe conceptual</title>
<desc id="desc">Dark interface with fixed left navigation, isometric office in the centre, agent infirmary, warehouse and delivery vehicles, and request chat on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#020812"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b2742"/><stop offset="1" stop-color="#06182b"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0878ef"/><stop offset="1" stop-color="#19d5ee"/></linearGradient>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f5ff} .muted{fill:#8eacc8;font-size:13px}.small{font-size:14px}.label{font-size:16px;font-weight:700}.panel{fill:url(#panel);stroke:#15517b;stroke-width:1.5}.tile{fill:#0b2037;stroke:#17486a;stroke-width:1}.line{stroke:#1b5279;stroke-width:1.5}.cyan{fill:#19d5ee}.green{fill:#23e6a2}.orange{fill:#ffb84d}.red{fill:#ff5e75}
  </style>
</defs>
