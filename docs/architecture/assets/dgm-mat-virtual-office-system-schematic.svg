<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">DGM-MAT — esquema integral do escritório virtual e cockpit</title>
<desc id="desc">Diagrama estático de camadas: proprietário e interfaces, cérebro DGM-MAT, departamentos, contratos e repositórios satélite. Não representa estado em direto.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#132744"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244f80"/><stop offset="1" stop-color="#14263f"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b304c"/><stop offset="1" stop-color="#111d30"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#80b9ff"/></marker>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#edf5ff}.subtitle{font:14px system-ui,sans-serif;fill:#9fb5d4}
    .section{font:700 16px system-ui,sans-serif;fill:#8fc0ff;letter-spacing:1.6px}
    .head{font:700 17px system-ui,sans-serif;fill:#e6f0ff}.body{font:13px system-ui,sans-serif;fill:#a9bedb}
    .small{font:11px system-ui,sans-serif;fill:#8fa7c9}.tile{fill:url(#tile);stroke:#355578;stroke-width:1.5}
    .line{stroke:#80b9ff;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#80b9ff;stroke-width:1.5;stroke-dasharray:6 7;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1100" rx="28" fill="url(#bg)"/>
<path d="M0 130H1600M0 390H1600M0 700H1600M0 1000H1600" stroke="#8cb8ef" stroke-opacity=".08"/>
<text x="60" y="62" class="title">DGM-MAT · Esquemática integral</text>
<text x="60" y="92" class="subtitle">Arquitetura estática · as linhas representam contratos previstos, não conectividade validada</text>
<rect x="60" y="120" width="1480" height="215" rx="22" fill="#101c2d" stroke="#324e70"/>
