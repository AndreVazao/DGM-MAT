<rect x="405" y="177" width="260" height="112" rx="15" class="tile"/><text x="535" y="210" text-anchor="middle" class="head">Cockpit PC</text><text x="535" y="235" text-anchor="middle" class="body">Chat · pedidos · anexos · missão</text><text x="535" y="258" text-anchor="middle" class="small">Prioridade: interface funcional</text>
